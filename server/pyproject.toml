[project]
name = "todo-server"
version = "0.1.0"
description = "Optional FastAPI + SQLite backend for the Todo App"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# `tests/` has no __init__.py, so without this pytest would put `server/tests`
# (not `server`) on sys.path and `import app` would fail.
pythonpath = ["."]
testpaths = ["tests"]
